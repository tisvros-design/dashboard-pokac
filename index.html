<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Dashboard POKAC</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0f1a;color:#e2e8f0;min-height:100vh;padding:16px}

        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        .header h1{font-size:20px;font-weight:700;color:#3b82f6}
        .hdr-right{display:flex;gap:8px;align-items:center}
        .hdr-btn{background:#1e293b;border:1px solid #2d3a50;border-radius:8px;padding:6px 12px;color:#94a3b8;font-size:12px;cursor:pointer}
        .hdr-btn:hover{border-color:#3b82f6;color:#3b82f6}
        .conn{font-size:10px;padding:3px 8px;border-radius:10px}
        .conn.ok{background:rgba(16,185,129,.15);color:#10b981}
        .conn.off{background:rgba(100,116,139,.15);color:#64748b}

        /* Carousel */
        .carousel-wrap{position:relative;margin-bottom:32px}
        .carousel-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#1e293b;border:2px solid #2d3a50;color:#94a3b8;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .carousel-nav:hover{border-color:#3b82f6;color:#3b82f6;background:#0f172a}
        .carousel-nav.prev{left:-20px}
        .carousel-nav.next{right:-20px}
        .carousel{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;padding:8px 20px;-ms-overflow-style:none;scrollbar-width:none}
        .carousel::-webkit-scrollbar{display:none}

        .day-card{flex:0 0 160px;background:#1e293b;border:2px solid #2d3a50;border-radius:14px;padding:16px 12px;text-align:center;transition:all .2s}
        .day-card:hover{transform:translateY(-3px);border-color:#3b82f6}
        .day-card.today{border-color:#10b981;background:linear-gradient(135deg,#064e3b 0%,#1e293b 100%);box-shadow:0 0 24px rgba(16,185,129,.25);flex:0 0 180px}
        .day-card.weekend-card{opacity:.65}

        .day-name{font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:2px}
        .day-date{font-size:20px;font-weight:800;color:#e2e8f0;margin-bottom:10px}
        .day-card.today .day-date{color:#10b981;font-size:24px}
        .day-card.today .day-name{color:#10b981}

        .duty-line{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;margin-bottom:3px;line-height:1.3}
        .duty-icon{font-size:13px}
        .duty-name.day{color:#60a5fa}
        .duty-name.evening{color:#fb923c}
        .duty-name.weekend{color:#34d399}
        .duty-name.vacation{color:#a78bfa}
        .duty-empty{color:#475569;font-size:11px}

        /* Settings */
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
        .modal-bg.active{display:flex}
        .modal{background:#1e293b;border-radius:12px;padding:24px;width:420px;max-width:95vw;border:1px solid #2d3a50}
        .modal h2{font-size:16px;margin-bottom:16px;color:#3b82f6}
        .modal .f{margin-bottom:14px}
        .modal label{display:block;font-size:11px;color:#64748b;text-transform:uppercase;margin-bottom:4px}
        .modal input{width:100%;padding:10px;background:#0f172a;border:1px solid #2d3a50;border-radius:6px;color:#e2e8f0;font-size:13px}
        .modal input:focus{outline:none;border-color:#3b82f6}
        .modal .hint{font-size:10px;color:#64748b;margin-top:4px}
        .mbtn{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
        .mbtn.p{background:#3b82f6;color:white}
        .mbtn.s{background:#334155;color:#e2e8f0}
        .mbtn.d{background:#7f1d1d;color:#fca5a5;margin-top:4px}

        .empty{text-align:center;padding:40px;color:#64748b;font-size:13px}
        .loading{text-align:center;padding:30px;color:#64748b}

        .update-time{text-align:center;margin-top:20px;font-size:11px;color:#475569}

        @media(max-width:700px){
            .day-card{flex:0 0 130px}
            .day-card.today{flex:0 0 150px}
            .carousel-nav{display:none}
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏢 Dashboard POKAC</h1>
    <div class="hdr-right">
        <span class="conn off" id="connStatus">—</span>
        <button class="hdr-btn" onclick="openSettings()">⚙️ Настройки</button>
    </div>
</div>

<!-- Carousel -->
<div class="carousel-wrap">
    <button class="carousel-nav prev" onclick="scrollCarousel(-3)">◀</button>
    <div class="carousel" id="carousel">
        <div class="loading">⏳ Загрузка графика...</div>
    </div>
    <button class="carousel-nav next" onclick="scrollCarousel(3)">▶</button>
</div>

<div class="update-time" id="updateTime"></div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
        <h2>⚙️ Настройки</h2>
        <div class="f">
            <label>Apps Script URL</label>
            <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <button class="mbtn p" onclick="saveSettings()">💾 Сохранить</button>
        <button class="mbtn s" onclick="closeSettings()">Закрыть</button>
    </div>
</div>

<script>
var DEFAULT_URL='https://script.google.com/macros/s/AKfycby9JoXmATa6_YaXuWSBdmVT2KBpOz-Dp1FWHb1cPoJqrG4-ow2bKfWfXlb3DzTvNnJLQo/exec';
var cfg={url:''};
var cachedData=null;
var viewOffset=0; // смещение от сегодня

// === SETTINGS ===
function openSettings(){
    document.getElementById('cfgUrl').value=cfg.url||'';
    document.getElementById('settingsModal').classList.add('active');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('active')}
function saveSettings(){
    cfg.url=document.getElementById('cfgUrl').value.trim();
    localStorage.setItem('duty_cfg',JSON.stringify(cfg));
    closeSettings();
    loadDuty();
}

// === JSONP LOAD ===
var loadIdx=0;
function loadDuty(){
    var url=cfg.url||DEFAULT_URL;
    if(!url){return;}
    window._dutyData=null;

    var s=document.createElement('script');
    s.id='dutyScript'+(++loadIdx);
    s.src=url+'?mode=jsonp';
    s.onload=function(){
        setTimeout(function(){
            if(window._dutyData && !window._dutyData.error){
                cachedData=window._dutyData;
                setConn(true);
                viewOffset=0;
                renderCarousel();
            }else{
                setConn(false);
            }
        },300);
    };
    s.onerror=function(){setConn(false)};
    document.body.appendChild(s);
}

function setConn(ok){
    var el=document.getElementById('connStatus');
    if(ok){el.className='conn ok';el.textContent='● Подключено'}
    else{el.className='conn off';el.textContent='○ Отключено'}
}

// === CAROUSEL ===
function renderCarousel(){
    if(!cachedData||!cachedData.employees)return;
    var data=cachedData;
    var today=data.date.day;
    var year=data.date.year;
    var month=data.date.month;

    // Центр — сегодня + offset
    var centerDay=today+viewOffset;
    var centerDate=new Date(year,month-1,centerDay);

    // Показываем 7 дней: center-3 ... center+3
    var startOffset=-3;
    var endOffset=3;

    var html='';
    for(var i=startOffset;i<=endOffset;i++){
        var d=new Date(centerDate);
        d.setDate(centerDate.getDate()+i);
        var dayNum=d.getDate();
        var dMonth=d.getMonth()+1;
        var isToday=(dayNum===today && dMonth===month && d.getFullYear()===year);
        var isWeekend=d.getDay()===0||d.getDay()===6;
        var dayNames=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];

        // Ищем дежурных
        var dayP=[],eveningP=[],weekendP=[];
        data.employees.forEach(function(emp){
            var v=emp.duties[dayNum];
            if(v==='day')dayP.push(emp.name);
            else if(v==='evening')eveningP.push(emp.name);
            else if(v==='weekend')weekendP.push(emp.name);
        });

        var dateStr=dayNum+'.'+String(dMonth).padStart(2,'0');

        html+='<div class="day-card'+(isToday?' today':'')+(isWeekend?' weekend-card':'')+'">';
        html+='<div class="day-name">'+dayNames[d.getDay()]+'</div>';
        html+='<div class="day-date">'+dateStr+'</div>';
        if(dayP.length||eveningP.length||weekendP.length){
            if(dayP.length) html+='<div class="duty-line"><span class="duty-icon">☀️</span><span class="duty-name day">'+esc(dayP.join(', '))+'</span></div>';
            if(eveningP.length) html+='<div class="duty-line"><span class="duty-icon">🌙</span><span class="duty-name evening">'+esc(eveningP.join(', '))+'</span></div>';
            if(weekendP.length) html+='<div class="duty-line"><span class="duty-icon">⛱</span><span class="duty-name weekend">'+esc(weekendP.join(', '))+'</span></div>';
        }else{
            html+='<div class="duty-empty">—</div>';
        }
        html+='</div>';
    }

    document.getElementById('carousel').innerHTML=html;

    // Прокрутить к центру (сегодня)
    setTimeout(function(){
        var c=document.getElementById('carousel');
        var cards=c.querySelectorAll('.day-card');
        if(cards[3]) cards[3].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    },100);

    document.getElementById('updateTime').textContent='Обновлено: '+new Date().toLocaleString('ru-RU');
}

function scrollCarousel(days){
    viewOffset+=days;
    renderCarousel();
}

// === UTILS ===
function esc(t){var d=document.createElement('div');d.textContent=t||'';return d.innerHTML}

// === INIT ===
(function(){
    try{cfg=JSON.parse(localStorage.getItem('duty_cfg')||'{}')}catch(e){}
    if(!cfg.url)cfg.url='';
    loadDuty();
    setInterval(loadDuty,60000);
})();
</script>
</body>
</html>
