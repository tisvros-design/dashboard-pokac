<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Dashboard POKAC</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0f1a;color:#e2e8f0;min-height:100vh;padding:20px 16px}

        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
        .header h1{font-size:20px;font-weight:700;color:#3b82f6}
        .hdr-right{display:flex;gap:8px;align-items:center}
        .hdr-btn{background:#1e293b;border:1px solid #2d3a50;border-radius:8px;padding:6px 12px;color:#94a3b8;font-size:12px;cursor:pointer}
        .hdr-btn:hover{border-color:#3b82f6;color:#3b82f6}
        .conn{font-size:10px;padding:3px 8px;border-radius:10px}
        .conn.ok{background:rgba(16,185,129,.15);color:#10b981}
        .conn.off{background:rgba(100,116,139,.15);color:#64748b}

        /* Carousel — centered, no scroll */
        .carousel-wrap{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto 24px}
        .carousel-nav{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#1e293b;border:2px solid #2d3a50;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .carousel-nav:hover{border-color:#3b82f6;color:#3b82f6;background:#0f172a}
        .carousel{display:flex;gap:10px;justify-content:center;flex:1;min-width:0}

        .day-card{flex:1 1 0;min-width:100px;max-width:160px;background:#1e293b;border:2px solid #2d3a50;border-radius:14px;padding:14px 8px;text-align:center;transition:all .2s}
        .day-card:hover{transform:translateY(-3px);border-color:#3b82f6}
        .day-card.today{border-color:#10b981;background:linear-gradient(135deg,#064e3b 0%,#1e293b 100%);box-shadow:0 0 24px rgba(16,185,129,.25)}
        .day-card.weekend-card{opacity:.6}

        .day-name{font-size:12px;font-weight:700;color:#94a3b8;margin-bottom:2px}
        .day-date{font-size:18px;font-weight:800;color:#e2e8f0;margin-bottom:8px}
        .day-card.today .day-date{color:#10b981;font-size:22px}
        .day-card.today .day-name{color:#10b981}

        .duty-line{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3}
        .duty-icon{font-size:14px}
        .duty-name.day{color:#60a5fa}
        .duty-name.evening{color:#fb923c}
        .duty-name.weekend{color:#34d399}
        .duty-name.vacation{color:#a78bfa}
        .duty-empty{color:#475569;font-size:10px}

        @keyframes pulse-today{0%,100%{box-shadow:0 0 20px rgba(16,185,129,.2)}50%{box-shadow:0 0 35px rgba(16,185,129,.5)}}
        .day-card.today.pulse{animation:pulse-today 2s ease-in-out infinite}

        /* Settings */
        .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
        .modal-bg.active{display:flex}
        .modal{background:#1e293b;border-radius:12px;padding:24px;width:520px;max-width:95vw;border:1px solid #2d3a50}
        .modal h2{font-size:16px;margin-bottom:16px;color:#3b82f6}

        .stats-table{width:100%;border-collapse:collapse;font-size:13px}
        .stats-table th{text-align:left;padding:8px 10px;border-bottom:2px solid #2d3a50;color:#64748b;font-size:11px;text-transform:uppercase}
        .stats-table td{padding:8px 10px;border-bottom:1px solid #1e293b}
        .stats-table tr:hover td{background:rgba(59,130,246,.05)}
        .stats-table .name{font-weight:600;color:#e2e8f0}
        .stats-table .num{text-align:center;font-weight:700;font-size:15px}
        .stats-table .c-day{color:#60a5fa}
        .stats-table .c-evening{color:#fb923c}
        .stats-table .c-weekend{color:#34d399}
        .stats-table .c-total{color:#e2e8f0}
        .stats-table .total-row td{border-top:2px solid #2d3a50;font-weight:700;color:#e2e8f0}
        .modal .f{margin-bottom:14px}
        .modal label{display:block;font-size:11px;color:#64748b;text-transform:uppercase;margin-bottom:4px}
        .modal input{width:100%;padding:10px;background:#0f172a;border:1px solid #2d3a50;border-radius:6px;color:#e2e8f0;font-size:13px}
        .modal input:focus{outline:none;border-color:#3b82f6}
        .mbtn{width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
        .mbtn.p{background:#3b82f6;color:white}
        .mbtn.s{background:#334155;color:#e2e8f0}

        .loading{text-align:center;padding:40px;color:#64748b}
        .update-time{text-align:center;margin-top:24px;font-size:11px;color:#475569}

        /* Tasks Stats Widgets */
        .tasks-section{max-width:1200px;margin:0 auto 24px}
        .tasks-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
        .tasks-title{font-size:14px;font-weight:600;color:#64748b}
        .tasks-count{font-size:12px;padding:3px 10px;border-radius:10px;background:rgba(59,130,246,.15);color:#3b82f6;font-weight:600}
        .tasks-widgets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
        .task-widget{background:#1e293b;border:1px solid #2d3a50;border-radius:12px;padding:16px 12px;text-align:center;transition:all .2s}
        .task-widget:hover{border-color:#3b82f6;transform:translateY(-2px)}
        .tw-num{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
        .tw-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
        .tw-color-blue .tw-num{color:#3b82f6}
        .tw-color-green .tw-num{color:#10b981}
        .tw-color-orange .tw-num{color:#f97316}
        .tw-color-red .tw-num{color:#ef4444}
        .tw-color-yellow .tw-num{color:#f59e0b}
        .tw-color-purple .tw-num{color:#a78bfa}
        .tw-color-cyan .tw-num{color:#06b6d4}
        .tw-today{font-size:10px;color:#475569;margin-top:6px;border-top:1px solid #2d3a50;padding-top:6px}
        .tw-created{font-size:11px;color:#10b981;font-weight:600;margin-bottom:2px}
        .tw-closed{font-size:11px;color:#ef4444;font-weight:600;margin-top:2px}
        .tasks-empty{text-align:center;padding:30px;color:#475569;font-size:12px}

        @media(max-width:700px){
            .day-card{padding:10px 6px}
            .day-date{font-size:14px}
            .day-card.today .day-date{font-size:18px}
            .duty-line{font-size:10px}
            .carousel-nav{width:32px;height:32px;font-size:14px}
            .tasks-widgets{grid-template-columns:repeat(3,1fr)}
            .tw-num{font-size:24px}
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🏢 Dashboard POKAC</h1>
    <div class="hdr-right">
        <span class="conn off" id="connStatus">—</span>
        <button class="hdr-btn" onclick="openStats()">📊 Статистика дежурств</button>
        <button class="hdr-btn" onclick="openSettings()">⚙️ Настройки</button>
    </div>
</div>

<div class="carousel-wrap">
    <button class="carousel-nav" onclick="scrollCarousel(-1)">◀</button>
    <div class="carousel" id="carousel">
        <div class="loading">⏳ Загрузка графика...</div>
    </div>
    <button class="carousel-nav" onclick="scrollCarousel(1)">▶</button>
</div>

<div class="update-time" id="updateTime"></div>

<!-- Tasks Stats -->
<div class="tasks-section">
    <div class="tasks-header">
        <div class="tasks-title">📋 Задачи — Техподдержка СЦ</div>
        <div class="tasks-count" id="tasksCount">—</div>
    </div>
    <div class="tasks-widgets" id="tasksWidgets">
        <div class="tasks-empty">⏳ Загрузка...</div>
    </div>
</div>

<div class="modal-bg" id="statsModal" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="modal">
        <h2>📊 Статистика дежурств — 
        <div id="statsContent"></div>
        <button class="mbtn s" onclick="document.getElementById('statsModal').classList.remove('active')">Закрыть</button>
    </div>
</div>

<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
        <h2>⚙️ Настройки</h2>
        <div class="f">
            <label>Apps Script URL</label>
            <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="f">
            <label>Planfix Token</label>
            <input type="password" id="cfgPfToken" placeholder="Токен Planfix (Настройки → Доступ к API)">
        </div>
        <div class="f">
            <label>Planfix API URL</label>
            <input type="text" id="cfgPfUrl" placeholder="https://rokass.planfix.ru/rest/">
        </div>
        <button class="mbtn p" onclick="saveSettings()">💾 Сохранить</button>
        <button class="mbtn s" onclick="closeSettings()">Закрыть</button>
    </div>
</div>

<script>
var DEFAULT_URL='https://script.google.com/macros/s/AKfycby9JoXmATa6_YaXuWSBdmVT2KBpOz-Dp1FWHb1cPoJqrG4-ow2bKfWfXlb3DzTvNnJLQo/exec';
var PF_PROXY='https://planfix-proxy.tisvros.workers.dev';
var PF_DEFAULT='https://rokass.planfix.ru/rest/';
var cfg={url:'',pfToken:'',pfUrl:''};
var cachedData=null;
var viewOffset=0;
var lastTodayKey='';
var allTasks=[];

function openSettings(){
    document.getElementById('cfgUrl').value=cfg.url||'';
    document.getElementById('cfgPfToken').value=cfg.pfToken||'';
    document.getElementById('cfgPfUrl').value=cfg.pfUrl||'';
    document.getElementById('settingsModal').classList.add('active');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('active')}
function saveSettings(){
    cfg.url=document.getElementById('cfgUrl').value.trim();
    cfg.pfToken=document.getElementById('cfgPfToken').value.trim();
    cfg.pfUrl=document.getElementById('cfgPfUrl').value.trim();
    localStorage.setItem('duty_cfg',JSON.stringify(cfg));
    closeSettings();
    loadDuty();
    loadTasks();
}

var loadIdx=0;
function loadDuty(){
    var url=cfg.url||DEFAULT_URL;
    if(!url)return;
    window._dutyData=null;

    var s=document.createElement('script');
    s.id='ds'+(++loadIdx);
    s.src=url+'?mode=jsonp&_='+Date.now();
    s.onload=function(){
        setTimeout(function(){
            if(window._dutyData && !window._dutyData.error){
                cachedData=window._dutyData;
                setConn(true);
                viewOffset=0;
                renderCarousel();
            }else{setConn(false)}
        },300);
    };
    s.onerror=function(){setConn(false)};
    document.body.appendChild(s);
}

function setConn(ok){
    var el=document.getElementById('connStatus');
    if(ok){el.className='conn ok';el.textContent='● Подключено'}
    else{el.className='conn off';el.textContent='○ Отключено'}
}

// === PLANFIX TASKS ===
function loadTasks(){
    if(!cfg.pfToken){
        document.getElementById('tasksWidgets').innerHTML='<div class="tasks-empty">⚙️ Введите токен Planfix в настройках</div>';
        return;
    }
    document.getElementById('tasksWidgets').innerHTML='<div class="tasks-empty">⏳ Загрузка задач...</div>';

    var pfBase=cfg.pfUrl||PF_DEFAULT;
    if(pfBase.charAt(pfBase.length-1)!=='/')pfBase+='/';
    var directUrl=pfBase+'task/list';
    var reqHeaders={'Authorization':'Bearer '+cfg.pfToken,'Content-Type':'application/json','Accept':'application/json'};

    // Запрос 1: Новые задачи (status=1) — для приоритетов, Трамвая
    var reqNew=JSON.stringify({
        page:1,pageSize:100,
        fields:'id,name,status,1872,12126,dateTime',
        filters:[{type:2,operator:'equal',value:'group:6164'},{type:10,operator:'equal',value:1}]
    });

    // Запрос 2: Все активные (кроме завершено/отменено) — для выездных
    var reqActive=JSON.stringify({
        page:1,pageSize:100,
        fields:'id,name,status,12126,dateTime',
        filters:[{type:2,operator:'equal',value:'group:6164'},{type:10,operator:'notequal',value:3},{type:10,operator:'notequal',value:4}]
    });

    // Запрос 3: Завершённые (status=3) — для счётчика "закрыто сегодня"
    var reqDone=JSON.stringify({
        page:1,pageSize:100,
        fields:'id,name,status,dateTime,actualCompletionDate',
        filters:[{type:2,operator:'equal',value:'group:6164'},{type:10,operator:'equal',value:3}]
    });

    function doPost(url,body){
        return fetch(url,{method:'POST',headers:reqHeaders,body:body})
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
    }

    function doProxy(url,body){
        return fetch(PF_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({url:url,method:'POST',headers:reqHeaders,body:JSON.parse(body)})
        }).then(function(r){return r.json();});
    }

    function fetchTasks(url,body){
        return doPost(url,body).catch(function(){return doProxy(url,body);});
    }

    Promise.all([
        fetchTasks(directUrl,reqNew),
        fetchTasks(directUrl,reqActive),
        fetchTasks(directUrl,reqDone)
    ]).then(function(results){
        var newD=results[0], activeD=results[1], doneD=results[2];
        var newTasks=(newD.tasks)||[];
        var activeTasks=(activeD.tasks)||[];
        var doneTasks=(doneD.tasks)||[];

        if(newD.error)throw new Error(newD.error);
        if(newD.result==='fail')throw new Error(newD.error||'API error');

        renderTasks(newTasks,activeTasks,doneTasks);
    }).catch(function(e){
        document.getElementById('tasksWidgets').innerHTML='<div class="tasks-empty">❌ '+esc(e.message)+'</div>';
    });
}

function getStatusId(t){
    var s=t.status;
    if(!s)return 0;
    return typeof s==='object'?s.id:s;
}

function renderTasks(newTasks,activeTasks,doneTasks){
    var el=document.getElementById('tasksWidgets');
    if(!newTasks.length&&!activeTasks.length){
        el.innerHTML='<div class="tasks-empty">✅ Нет задач</div>';
        document.getElementById('tasksCount').textContent='0';
        return;
    }

    var today=new Date();
    var todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

    var total=newTasks.length,totalToday=0;
    var tramvay=0,tramvayToday=0;
    var regular=0,regToday=0, urgent=0,urgToday=0, blocking=0,blkToday=0;
    var support=0,supToday=0, internal=0,intToday=0;
    var noPriority=0,npToday=0;
    var onsite=0,onsiteToday=0;

    // Приоритеты и Трамвай — по НОВЫМ (status=1)
    newTasks.forEach(function(t){
        var created='';
        if(t.dateTime){var dt=t.dateTime;created=typeof dt==='object'?dt.date||dt.datetime||'':String(dt);}
        var isToday=created.indexOf(todayStr)===0;

        total++;
        if(isToday)totalToday++;

        var name=(t.name||'').toUpperCase();
        var isTramvay=name.indexOf('MAX')===0||name.indexOf('ТРАМВАЙ')===0;
        if(isTramvay){tramvay++;if(isToday)tramvayToday++;}

        var cf=t.customFieldData||[];
        var pName='';
        for(var i=0;i<cf.length;i++){
            var f=cf[i];
            var fid=f.field?f.field.id:f.id;
            if(fid===1872){
                var v=f.value;
                if(v&&typeof v==='object')v=v.value||'';
                pName=String(v).replace(/[⏳⛔🔥👨🏻‍💻📋\u{1F4CB}]/gu,'').replace(/\s+/g,' ').trim();
            }
        }

        if(pName.indexOf('Блокирующая')!==-1){blocking++;if(isToday)blkToday++;}
        else if(pName.indexOf('Срочная')!==-1){urgent++;if(isToday)urgToday++;}
        else if(pName.indexOf('Техническая')!==-1||pName.indexOf('поддержка')!==-1){support++;if(isToday)supToday++;}
        else if(pName.indexOf('Внутренние')!==-1||pName.indexOf('поручения')!==-1){internal++;if(isToday)intToday++;}
        else if(pName.indexOf('Обычная')!==-1){regular++;if(isToday)regToday++;}
        else{noPriority++;if(isToday)npToday++;}
    });

    // Выездные — по АКТИВНЫМ (все кроме 3,4)
    activeTasks.forEach(function(t){
        var created='';
        if(t.dateTime){var dt=t.dateTime;created=typeof dt==='object'?dt.date||dt.datetime||'':String(dt);}
        var isToday=created.indexOf(todayStr)===0;

        var cf=t.customFieldData||[];
        for(var i=0;i<cf.length;i++){
            var f=cf[i];
            var fid=f.field?f.field.id:f.id;
            if(fid===12126){
                var av=f.value;
                if(av&&typeof av==='object')av=av.value||'';
                if(av&&String(av).trim()){onsite++;if(isToday)onsiteToday++;break;}
            }
        }
    });

    // Закрытые сегодня — по ЗАВЕРШЁННЫМ (status=3)
    var doneToday=0;
    (doneTasks||[]).forEach(function(t){
        var dt='';
        // Приоритет: actualCompletionDate > dateTime
        if(t.actualCompletionDate){
            var ac=t.actualCompletionDate;
            dt=typeof ac==='object'?ac.date||ac.datetime||'':String(ac);
        }
        if(!dt&&t.dateTime){
            var d=t.dateTime;
            dt=typeof d==='object'?d.date||d.datetime||'':String(d);
        }
        if(dt.indexOf(todayStr)===0)doneToday++;
    });

    document.getElementById('tasksCount').textContent=total;

    var html='';
    html+=ww(total,totalToday,doneToday,'Новых','blue');
    html+=ww(regular,regToday,doneToday,'Обычная','green');
    html+=ww(urgent,urgToday,doneToday,'Срочная','yellow');
    html+=ww(blocking,blkToday,doneToday,'Блокирующая','red');
    html+=ww(support,supToday,doneToday,'Техподдержка','cyan');
    html+=ww(internal,intToday,doneToday,'Поручения','purple');
    html+=ww(tramvay,tramvayToday,doneToday,'🚃 Трамвай','orange');
    html+=ww(onsite,onsiteToday,doneToday,'📍 Выездные','green');
    if(noPriority)html+=ww(noPriority,npToday,doneToday,'Без приоритета','blue');

    el.innerHTML=html;
}

function ww(n,created,closed,label,color){
    var s='<div class="task-widget tw-color-'+color+'">';
    s+='<div class="tw-created">+'+created+'</div>';
    s+='<div class="tw-num">'+n+'</div>';
    s+='<div class="tw-label">'+label+'</div>';
    s+='<div class="tw-closed">−'+closed+'</div>';
    return s+'</div>';
}

function renderCarousel(){
    if(!cachedData||!cachedData.employees)return;
    var data=cachedData;
    var today=data.date.day;
    var year=data.date.year;
    var month=data.date.month;
    var centerDay=today+viewOffset;
    var centerDate=new Date(year,month-1,centerDay);
    var dayNames=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];

    // Проверяем изменились ли дежурные сегодня
    var todayKey='';
    data.employees.forEach(function(emp){
        var v=emp.duties[today]||'';
        todayKey+=emp.name+':'+v+',';
    });
    var pulseToday=(lastTodayKey && lastTodayKey!==todayKey);
    lastTodayKey=todayKey;

    var html='';

    for(var i=-3;i<=3;i++){
        var d=new Date(centerDate);
        d.setDate(centerDate.getDate()+i);
        var dayNum=d.getDate();
        var dMonth=d.getMonth()+1;
        var isToday=(dayNum===today && dMonth===month && d.getFullYear()===year);
        var isWk=d.getDay()===0||d.getDay()===6;

        var dp=[],ep=[],wp=[];
        data.employees.forEach(function(emp){
            var v=emp.duties[dayNum];
            if(v==='day')dp.push(emp.name);
            else if(v==='evening')ep.push(emp.name);
            else if(v==='weekend')wp.push(emp.name);
        });

        html+='<div class="day-card'+(isToday?' today':'')+(isWk?' weekend-card':'')+(isToday && pulseToday?' pulse':'')+'">';
        html+='<div class="day-name">'+dayNames[d.getDay()]+'</div>';
        html+='<div class="day-date">'+dayNum+'.'+String(dMonth).padStart(2,'0')+'</div>';
        if(dp.length)html+='<div class="duty-line"><span class="duty-icon">☀️</span><span class="duty-name day">'+esc(dp.join(', '))+'</span></div>';
        if(ep.length)html+='<div class="duty-line"><span class="duty-icon">🌙</span><span class="duty-name evening">'+esc(ep.join(', '))+'</span></div>';
        if(wp.length)html+='<div class="duty-line"><span class="duty-icon">⛱</span><span class="duty-name weekend">'+esc(wp.join(', '))+'</span></div>';
        if(!dp.length&&!ep.length&&!wp.length)html+='<div class="duty-empty">—</div>';
        html+='</div>';
    }

    document.getElementById('carousel').innerHTML=html;
    document.getElementById('updateTime').textContent='Обновлено: '+new Date().toLocaleString('ru-RU');
}

function scrollCarousel(d){viewOffset+=d;renderCarousel()}

function esc(t){var e=document.createElement('div');e.textContent=t||'';return e.innerHTML}

function openStats(){
    if(!cachedData||!cachedData.employees)return;
    var data=cachedData;
    var monthName=data.month;

    var html='<table class="stats-table">';
    html+='<tr><th>ФИО</th><th style="text-align:center">☀️ Дневные</th><th style="text-align:center">🌙 Вечерние</th><th style="text-align:center">⛱ Выходные</th><th style="text-align:center">Итого</th></tr>';

    var tDay=0,tEvening=0,tWeekend=0;

    data.employees.forEach(function(emp){
        var days=0,evenings=0,weekends=0;
        Object.values(emp.duties).forEach(function(v){
            if(v==='day')days++;
            else if(v==='evening')evenings++;
            else if(v==='weekend')weekends++;
        });
        var total=days+evenings+weekends;
        tDay+=days;tEvening+=evenings;tWeekend+=weekends;

        html+='<tr>';
        html+='<td class="name">'+esc(emp.name)+'</td>';
        html+='<td class="num c-day">'+days+'</td>';
        html+='<td class="num c-evening">'+evenings+'</td>';
        html+='<td class="num c-weekend">'+weekends+'</td>';
        html+='<td class="num c-total">'+total+'</td>';
        html+='</tr>';
    });

    html+='<tr class="total-row">';
    html+='<td>ИТОГО</td>';
    html+='<td class="num c-day">'+tDay+'</td>';
    html+='<td class="num c-evening">'+tEvening+'</td>';
    html+='<td class="num c-weekend">'+tWeekend+'</td>';
    html+='<td class="num c-total">'+(tDay+tEvening+tWeekend)+'</td>';
    html+='</tr></table>';

    document.getElementById('statsContent').innerHTML=html;
    document.getElementById('statsModal').classList.add('active');
}

(function(){
    try{cfg=JSON.parse(localStorage.getItem('duty_cfg')||'{}')}catch(e){}
    if(!cfg.url)cfg.url='';
    loadDuty();
    loadTasks();
    setInterval(loadDuty,60000);
    setInterval(loadTasks,300000); // обновление задач каждые 5 минут
})();
</script>
